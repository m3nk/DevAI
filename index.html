<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevAI Arcade</title>
<style>
  :root {
    --bg: #0b0e17;
    --bg2: #111627;
    --card: #161c31;
    --card-hover: #1c2440;
    --border: #26304f;
    --text: #e8ecf8;
    --muted: #8b94b3;
    --accent: #6c8cff;
    --accent2: #9f6cff;
    --green: #3ddc97;
    --amber: #ffc555;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(1200px 600px at 70% -10%, #1a2145 0%, var(--bg) 55%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 48px 24px 8px;
    max-width: 1080px;
    margin: 0 auto;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .logo-mark {
    width: 46px; height: 46px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid; place-items: center;
    font-size: 24px;
    box-shadow: 0 4px 24px rgba(108,140,255,.35);
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: .5px;
  }
  h1 span { color: var(--accent); }
  .tagline {
    color: var(--muted);
    margin-top: 10px;
    font-size: 15px;
  }
  .stats {
    display: flex;
    gap: 22px;
    margin-top: 22px;
    font-size: 13px;
    color: var(--muted);
  }
  .stats b { color: var(--text); }
  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 24px 80px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
    position: relative;
    overflow: hidden;
  }
  .card.playable:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    background: var(--card-hover);
  }
  .card .icon {
    width: 52px; height: 52px;
    border-radius: 12px;
    display: grid; place-items: center;
    font-size: 26px;
    background: rgba(108,140,255,.12);
    border: 1px solid rgba(108,140,255,.25);
  }
  .card h2 { font-size: 17px; font-weight: 600; }
  .card p {
    font-size: 13px; color: var(--muted); line-height: 1.5; flex: 1;
    /* clamp to 2 lines so every card keeps the same height */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .badge {
    position: absolute;
    top: 16px; right: 16px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .5px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .badge.play { background: rgba(61,220,151,.12); color: var(--green); border: 1px solid rgba(61,220,151,.3); }
  .badge.soon { background: rgba(255,197,85,.1); color: var(--amber); border: 1px solid rgba(255,197,85,.25); }
  .card.soon { cursor: default; opacity: .75; }
  .card .play-hint {
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
    opacity: 0;
    transition: opacity .15s ease;
  }
  /* reserve the hint's space on every card so the grid stays uniform */
  .card.soon::after {
    content: "";
    display: block;
    font-size: 12px;
    font-weight: 600;
    line-height: normal;
    visibility: hidden;
    height: 14px;
  }
  .card.playable:hover .play-hint { opacity: 1; }
  .add-card {
    border: 1px dashed var(--border);
    background: transparent;
    display: grid;
    place-items: center;
    color: var(--muted);
    min-height: 190px;
    border-radius: 16px;
    font-size: 14px;
    text-align: center;
    line-height: 1.6;
    padding: 20px;
  }
  .add-card .plus { font-size: 28px; display: block; margin-bottom: 6px; color: var(--border); }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 0 24px 40px;
  }
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-mark">🕹️</div>
    <div>
      <h1>DevAI <span>Arcade</span></h1>
      <div class="tagline">A growing collection of self-contained HTML games. Pick one and play.</div>
    </div>
  </div>
  <div class="stats">
    <div><b id="stat-playable">0</b> playable</div>
    <div><b id="stat-soon">0</b> coming soon</div>
  </div>
</header>

<main>
  <div class="grid" id="game-grid"><!-- cards injected from GAMES registry --></div>
  <div style="margin-top:18px">
    <div class="add-card">
      <span><span class="plus">＋</span>More games on the way.<br>Each game is a single HTML file inside <code>games/</code>.</span>
    </div>
  </div>
</main>

<footer>DevAI — powered by pure HTML5 · no build step · no dependencies</footer>

<script>
// ─── GAME REGISTRY ─────────────────────────────────────────────
// To add a game: drop its HTML file in games/, add one entry here.
//   file    → path to the game html (playable cards only)
//   status  → 'play' or 'soon'
const GAMES = [
  {
    title: "Snake",
    icon: "🐍",
    desc: "Neon classic: smooth motion, wrap/walls modes, sounds, high score saved.",
    file: "games/snake.html",
    status: "play"
  },
  {
    title: "Pong",
    icon: "🏓",
    desc: "1P vs CPU (3 difficulties), local 2P, spin physics, particles, synth audio. First to 5/11/21.",
    file: "games/pong.html",
    status: "play"
  },
  {
    title: "Breakout",
    icon: "🧱",
    desc: "Smash every brick: power-ups, lasers, combos, 10 levels, synthesized sound.",
    file: "games/breakout.html",
    status: "play"
  },
  {
    title: "Memory Match",
    icon: "🃏",
    desc: "Flip cards, find pairs: 3 grid sizes, best-score records, synth sounds.",
    file: "games/memory.html",
    status: "play"
  },
  {
    title: "Flappy Bird",
    icon: "🐤",
    desc: "One button. Endless pipes. Rising rage. Best score saved locally.",
    file: "games/flappy.html",
    status: "play"
  },
  {
    title: "Pac-Man",
    icon: `<svg viewBox="0 0 100 100" width="34" height="34" aria-label="Pac-Man">
      <polygon points="12,3.9 50,50 12,96.1" fill="rgba(108,140,255,.12)"/>
      <path d="M 96.6 25 A 50 50 0 1 0 96.6 75 L 50 50 Z" fill="#FFE13B"/>
      <circle cx="58" cy="22" r="5.5" fill="#0b0e1a"/>
    </svg>`,
    desc: "The full maze: 4 ghosts with real AI, power pellets, tunnels, levels.",
    file: "games/pacman.html",
    status: "play"
  },
  {
    title: "Tic-Tac-Toe",
    icon: "⭕",
    desc: "Neon X vs O: unbeatable minimax CPU, 2-player mode, score records.",
    file: "games/tictactoe.html",
    status: "play"
  },
  {
    title: "Neon Vanguard",
    icon: "🚀",
    desc: "Top-down space shooter: splitting asteroids, hunting ships, wave ramp, 3 lives.",
    file: "games/neonvanguard.html",
    status: "play"
  },
  {
    title: "Dead Light",
    icon: "🧟",
    desc: "Top-down zombie survival in the dark: flashlight cone, ammo economy, kill drops, escalating horde.",
    file: "games/zombielight.html",
    status: "play"
  },
  {
    title: "Missile Command",
    icon: "🛡️",
    desc: "Defend six cities: 3 silos, chain-reaction interceptions, MIRVs, smart bombs, escalating waves, high score saved.",
    file: "games/missilecommand.html",
    status: "play"
  },
  {
    title: "Fruit Slicer",
    icon: "🍉",
    desc: "Fruit Ninja style: swipe to slice, combo x3 bonuses, critical hits, bombs, 3 lives, best score saved.",
    file: "games/fruitslicer.html",
    status: "play"
  },
  {
    title: "Typing Defense",
    icon: "⌨️",
    desc: "Type falling words to destroy them: waves, boss words, power-ups (slow/bomb/shield), live WPM + combo, best score saved.",
    file: "games/typingdefense.html",
    status: "play"
  },
  {
    title: "Tower Defense",
    icon: "🏰",
    desc: "Hold 25 waves with 4 tower types (gunner, cannon, frost, sniper), 3 upgrade levels, targeting modes, boss waves, 1–3× speed.",
    file: "games/towerdefense.html",
    status: "play"
  }
];
// ───────────────────────────────────────────────────────────────

function render() {
  const grid = document.getElementById("game-grid");
  let playable = 0, soon = 0;
  // Ready-to-play games always come first; "soon" cards follow.
  const ordered = [...GAMES].sort((a, b) =>
    (a.status === "play" ? 0 : 1) - (b.status === "play" ? 0 : 1)
  );
  for (const g of ordered) {
    const isPlay = g.status === "play";
    if (isPlay) playable++; else soon++;
    const tag = isPlay ? "a" : "div";
    const href = isPlay ? ` href="${g.file}"` : "";
    grid.insertAdjacentHTML("beforeend", `
      <${tag} class="card ${isPlay ? "playable" : "soon"}"${href}>
        <span class="badge ${isPlay ? "play" : "soon"}">${isPlay ? "Play" : "Soon"}</span>
        <div class="icon">${g.icon}</div>
        <h2>${g.title}</h2>
        <p>${g.desc}</p>
        ${isPlay ? '<span class="play-hint">▶ Play now</span>' : ""}
      </${tag}>`);
  }
  document.getElementById("stat-playable").textContent = playable;
  document.getElementById("stat-soon").textContent = soon;
}
render();
</script>
</body>
</html>
