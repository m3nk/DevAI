<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEMORY MATCH</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #04060d; overflow: hidden;
    font-family: "Courier New", Courier, monospace;
    user-select: none;
  }
  #stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #wrap {
    position: relative;
    width: min(96vw, 760px);
    height: min(96vh, 640px);
    display: flex; flex-direction: column; align-items: center;
    background: #070b16;
    border: 1px solid rgba(34,211,238,.18);
    border-radius: 6px;
  }
  #wrap::before { /* vignette */
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5;
    border-radius: 6px;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  #wrap::after { /* scanlines */
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 6;
    border-radius: 6px;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px);
  }

  .overlay {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: rgba(4,7,15,.82); backdrop-filter: blur(3px);
    border-radius: 6px;
    color: #cfeeff; text-align: center;
  }
  .hidden { display: none !important; }

  h1.title {
    margin: 0; font-size: clamp(30px, 8vw, 58px); letter-spacing: .22em; font-weight: 900;
    color: #eafcff;
    text-shadow: 0 0 12px #22d3ee, 0 0 42px rgba(34,211,238,.6), 6px 4px 0 rgba(251,146,60,.55);
  }
  .sub { color: #7ea8c4; letter-spacing: .3em; font-size: 13px; margin-top: -6px; }

  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .rowLabel {
    width: 130px; text-align: right; font-size: 14px; letter-spacing: .25em;
    color: #6d92ab;
  }
  .opt {
    padding: 9px 18px; font-family: inherit; font-size: 14px; letter-spacing: .18em;
    color: #9cc6dd; background: rgba(10,16,32,.75);
    border: 1px solid rgba(34,211,238,.28); border-radius: 4px; cursor: pointer;
    transition: all .12s;
  }
  .opt:hover { color: #eafcff; border-color: rgba(34,211,238,.7); }
  .opt.sel {
    color: #061018; background: #22d3ee; border-color: #67e8f9;
    box-shadow: 0 0 14px rgba(34,211,238,.75);
    font-weight: bold;
  }
  .big {
    margin-top: 10px; padding: 14px 46px; font-size: 20px; letter-spacing: .3em;
    color: #0b0f06; background: #fb923c; border: none; border-radius: 4px;
    font-family: inherit; font-weight: 900; cursor: pointer;
    box-shadow: 0 0 22px rgba(251,146,60,.7);
  }
  .big:hover { background: #fdba74; box-shadow: 0 0 34px rgba(251,146,60,.95); }
  .ghostBtn {
    padding: 10px 26px; font-family: inherit; font-size: 14px; letter-spacing: .2em;
    color: #9cc6dd; background: transparent; border: 1px solid rgba(156,198,221,.4);
    border-radius: 4px; cursor: pointer;
  }
  .ghostBtn:hover { color: #fff; border-color: #fff; }
  .help { color: #557488; font-size: 12px; letter-spacing: .15em; line-height: 1.9; }
  .best {
    color: #fb923c; font-size: 14px; letter-spacing: .2em;
    text-shadow: 0 0 10px rgba(251,146,60,.6);
  }
  #winText { font-size: clamp(26px, 7vw, 44px); font-weight: 900; letter-spacing: .22em; margin: 0;
    color: #eafcff; text-shadow: 0 0 14px #22d3ee, 0 0 40px rgba(34,211,238,.5); }
  #recordText { font-size: 16px; font-weight: 900; letter-spacing: .3em; color: #fde68a;
    text-shadow: 0 0 14px rgba(251,146,60,.9); animation: recPulse .8s infinite alternate; }
  @keyframes recPulse { from { opacity: .55; } to { opacity: 1; } }
  #statText { color: #8fc0da; font-size: 15px; letter-spacing: .12em; line-height: 2; }

  #muteBtn {
    position: absolute; top: 10px; right: 12px; z-index: 12;
    background: rgba(10,16,32,.7); border: 1px solid rgba(34,211,238,.35);
    color: #cfeeff; font-size: 18px; line-height: 1; padding: 6px 10px;
    border-radius: 4px; cursor: pointer; font-family: inherit;
  }
  #muteBtn:hover { border-color: #22d3ee; }

  /* ---- HUD ---- */
  #hud {
    width: 100%; box-sizing: border-box;
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px; gap: 8px;
    border-bottom: 1px solid rgba(34,211,238,.15);
    color: #8fc0da; font-size: clamp(11px, 2.6vw, 15px); letter-spacing: .15em;
  }
  #hud b { color: #eafcff; text-shadow: 0 0 8px rgba(34,211,238,.8); font-size: 1.25em; }
  #hud .hudBest b { color: #fdba74; text-shadow: 0 0 8px rgba(251,146,60,.8); }

  /* ---- board ---- */
  #board {
    flex: 1; width: 100%; box-sizing: border-box;
    --gap: clamp(6px, 1.6vw, 14px);
    display: grid; gap: var(--gap);
    padding: clamp(10px, 2.4vw, 22px);
    align-content: center; justify-content: center;
    grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr));
    grid-template-rows: repeat(var(--rows, 4), minmax(0, 1fr));
  }
  @supports (container-type: size) {
    /* size cards from BOTH board dimensions so they keep the 3:4 card
       ratio and never overflow the fixed-height panel */
    #board {
      container-type: size;
      grid-template-columns: repeat(var(--cols, 4), auto);
      grid-template-rows: repeat(var(--rows, 4), auto);
    }
    .card {
      contain: none;
      width: min(
        calc((100cqw - (var(--cols, 4) - 1) * var(--gap)) / var(--cols, 4)),
        calc((100cqh - (var(--rows, 4) - 1) * var(--gap)) / var(--rows, 4) * 3 / 4)
      );
      aspect-ratio: 3 / 4;
    }
  }
  .card {
    position: relative;
    /* fallback (no container queries): fill the height-constrained grid
       cell instead of deriving height from width via aspect-ratio, which
       overflowed short viewports */
    contain: size;
    perspective: 700px;
    background: none; border: none; padding: 0;
    font-family: inherit; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .card:focus-visible { outline: 2px solid #22d3ee; outline-offset: 3px; border-radius: 8px; }
  .cardInner {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transition: transform .38s cubic-bezier(.4, 1.4, .6, 1);
  }
  .card.up .cardInner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    font-size: clamp(20px, min(7vw, 9vh), 44px);
  }
  .faceDown {
    background: linear-gradient(160deg, #0d1830, #0a1122 60%);
    border: 1px solid rgba(34,211,238,.35);
    box-shadow: inset 0 0 18px rgba(34,211,238,.08);
    color: rgba(34,211,238,.5);
    font-size: clamp(16px, 4vw, 26px);
    text-shadow: 0 0 8px rgba(34,211,238,.5);
  }
  .card:not(.up):not(.matched):hover .faceDown {
    border-color: rgba(103,232,249,.9);
    box-shadow: inset 0 0 22px rgba(34,211,238,.2), 0 0 12px rgba(34,211,238,.35);
  }
  .faceUp {
    background: linear-gradient(160deg, #10233a, #0b1526);
    border: 1px solid rgba(156,198,221,.4);
    transform: rotateY(180deg);
  }
  .card.matched .faceUp {
    border-color: #34d399;
    background: radial-gradient(circle at 50% 45%, rgba(52,211,153,.28), rgba(11,21,38,.95) 72%);
    box-shadow: 0 0 18px rgba(52,211,153,.7), 0 0 36px rgba(34,211,238,.35);
    animation: matchPop .45s ease;
  }
  @keyframes matchPop {
    0% { transform: rotateY(180deg) scale(1); }
    45% { transform: rotateY(180deg) scale(1.14); }
    100% { transform: rotateY(180deg) scale(1); }
  }
  .card.wrong .faceUp {
    border-color: #f87171;
    box-shadow: 0 0 18px rgba(248,113,113,.7);
    animation: shakeX .42s ease;
  }
  @keyframes shakeX {
    0%, 100% { transform: rotateY(180deg) translateX(0); }
    20% { transform: rotateY(180deg) translateX(-7px); }
    40% { transform: rotateY(180deg) translateX(6px); }
    60% { transform: rotateY(180deg) translateX(-4px); }
    80% { transform: rotateY(180deg) translateX(3px); }
  }
</style>
</head>
<body>
<!-- DEVAI-MENU:BEGIN -->
<style>
  #devai-home{position:fixed;z-index:2147483000;left:10px;top:10px;
    display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
    white-space:nowrap;font:600 12px/1 "Segoe UI",system-ui,-apple-system,sans-serif;
    letter-spacing:.4px;text-decoration:none;color:var(--da-fg,#dfe6f5);
    background:var(--da-bg,rgba(10,14,24,.62));border:1px solid var(--da-bd,rgba(108,140,255,.45));
    box-shadow:0 4px 14px rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    opacity:.72;transition:opacity .15s ease,transform .15s ease,background .15s ease;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer}
  #devai-home:hover,#devai-home:focus-visible{opacity:1;transform:translateY(-1px);
    background:var(--da-bgh,rgba(28,38,68,.92))}

<a id="devai-home" href="../index.html" title="Back to the DevAI Arcade dashboard &#8212; pick another game"><span class="da-i">&#127918;</span><span class="da-t">Menu</span></a>

<!-- DEVAI-MENU:END -->





<div id="stage">
  <div id="wrap">
    <button id="muteBtn" title="Mute (M)">&#128266;</button>

    <div id="hud">
      <span>MOVES <b id="hudMoves">0</b></span>
      <span>PAIRS <b id="hudMatches">0</b>/<b id="hudTotal">0</b></span>
      <span>TIME <b id="hudTime">0:00</b></span>
      <span class="hudBest">BEST <b id="hudBest">--</b></span>
    </div>

    <div id="board"></div>

    <div id="menu" class="overlay">
      <h1 class="title">MEMORY&nbsp;MATCH</h1>
      <div class="sub">CONCENTRATION &bull; NEON ARCADE</div>

      <div class="row" id="rowDiff">
        <span class="rowLabel">GRID</span>
        <button class="opt" data-group="diff" data-val="easy">EASY 4&times;3</button>
        <button class="opt" data-group="diff" data-val="medium">MED 4&times;4</button>
        <button class="opt" data-group="diff" data-val="hard">HARD 6&times;4</button>
      </div>
      <div class="best" id="menuBest">BEST: --</div>

      <button class="big" id="startBtn">START</button>
      <div class="help">
        CLICK OR TAB + ENTER TO FLIP CARDS<br>
        R = RESTART&nbsp;&nbsp;&nbsp;&nbsp;M = MUTE&nbsp;&nbsp;&nbsp;&nbsp;ESC = MENU
      </div>
    </div>

    <div id="overOv" class="overlay hidden">
      <div id="winText">YOU WIN</div>
      <div id="recordText" class="hidden">&#9733; NEW RECORD &#9733;</div>
      <div id="statText"></div>
      <button class="big" id="againBtn">PLAY AGAIN</button>
      <button class="ghostBtn" id="toMenuBtn">MAIN MENU</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ============================================================
   MEMORY MATCH — single-file neon arcade concentration game
   CSS 3D flip cards, Web Audio SFX, localStorage best scores.
   ============================================================ */

/* ---- configuration ---- */
const DIFFS = {
  easy:   { cols: 4, rows: 3, pairs: 6 },
  medium: { cols: 4, rows: 4, pairs: 8 },
  hard:   { cols: 6, rows: 4, pairs: 12 }
};
const EMOJIS = ['🚀','👾','🕹️','🎮','⭐','🌙','⚡','🔥','💎','🎯','🛸','🍄'];
const MISMATCH_DELAY = 800;   // ms cards stay up on a mismatch
const BEST_KEY = 'memoryMa…ests';

/* ---- DOM ---- */
const boardEl    = document.getElementById('board');
const menuEl     = document.getElementById('menu');
const overOvEl   = document.getElementById('overOv');
const startBtn   = document.getElementById('startBtn');
const againBtn   = document.getElementById('againBtn');
const toMenuBtn  = document.getElementById('toMenuBtn');
const muteBtn    = document.getElementById('muteBtn');
const hudMoves   = document.getElementById('hudMoves');
const hudMatches = document.getElementById('hudMatches');
const hudTotal   = document.getElementById('hudTotal');
const hudTime    = document.getElementById('hudTime');
const hudBest    = document.getElementById('hudBest');
const menuBest   = document.getElementById('menuBest');
const winTextEl  = document.getElementById('winText');
const recordEl   = document.getElementById('recordText');
const statTextEl = document.getElementById('statText');
const rowDiffEl  = document.getElementById('rowDiff');

/* ---- state ---- */
let state = 'menu';           // menu | playing | won
let diff  = 'medium';
let muted = false;
let cards = [];               // { emoji, up, matched, el }
let firstIdx = -1, secondIdx = -1;
let moves = 0, matched = 0;
let locked = false;           // input lock during mismatch delay
let timerStart = 0, timerMs = 0, timerId = null;

/* ---- best scores (fewest moves per difficulty) ---- */
function loadBests() {
  try {
    const raw = localStorage.getItem(BEST_KEY);
    const obj = raw ? JSON.parse(raw) : null;
    return (obj && typeof obj === 'object') ? obj : {};
  } catch (e) { return {}; }
}
function saveBest(d, val) {
  const b = loadBests();
  if (typeof b[d] !== 'number' || val < b[d]) {
    b[d] = val;
    try { localStorage.setItem(BEST_KEY, JSON.stringify(b)); } catch (e) {}
    return true;
  }
  return false;
}
function bestFor(d) {
  const v = loadBests()[d];
  return (typeof v === 'number' && v > 0) ? v : null;
}

/* ---- audio (Web Audio, no files) ---- */
let AC = null;
function ac() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, gain, slideTo, when) {
  if (muted) return;
  const c = ac();
  if (!c) return;
  const t0 = c.currentTime + (when || 0);
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(gain || 0.12, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const sfxFlip     = () => tone(520, 0.07, 'triangle', 0.1, 760);
const sfxMatch    = () => { tone(660, 0.12, 'square', 0.09); tone(990, 0.16, 'square', 0.09, null, 0.09); };
const sfxMismatch = () => tone(220, 0.22, 'sawtooth', 0.12, 110);
function sfxWin() {
  [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.22, 'square', 0.1, null, i * 0.13));
}

/* ---- shuffle: Fisher-Yates ---- */
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

/* ---- board build ---- */
function buildBoard() {
  const cfg = DIFFS[diff];
  boardEl.style.setProperty('--cols', cfg.cols);
  boardEl.style.setProperty('--rows', cfg.rows);
  boardEl.innerHTML = '';
  cards = [];
  const faces = shuffle(EMOJIS.slice(0, cfg.pairs));
  const deck = shuffle(faces.concat(faces));
  deck.forEach((emoji, idx) => {
    const btn = document.createElement('button');
    btn.className = 'card';
    btn.type = 'button';
    btn.setAttribute('aria-label', 'Card ' + (idx + 1));
    btn.innerHTML =
      '<span class="cardInner">' +
        '<span class="face faceDown">&#10022;</span>' +
        '<span class="face faceUp">' + emoji + '</span>' +
      '</span>';
    const card = { emoji, up: false, matched: false, el: btn };
    btn.addEventListener('click', () => onCard(card));
    boardEl.appendChild(btn);
    cards.push(card);
  });
  hudTotal.textContent = cfg.pairs;
}

/* ---- HUD ---- */
function fmtTime(ms) {
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function updateHud() {
  hudMoves.textContent = moves;
  hudMatches.textContent = matched;
  hudTime.textContent = fmtTime(timerMs);
  const b = bestFor(diff);
  hudBest.textContent = b === null ? '--' : b;
}
function startTimer() {
  stopTimer();
  timerStart = performance.now();
  timerId = setInterval(() => {
    timerMs = performance.now() - timerStart;
    hudTime.textContent = fmtTime(timerMs);
  }, 250);
}
function stopTimer() {
  if (timerId !== null) { clearInterval(timerId); timerId = null; }
}

/* ---- game flow ---- */
function showOverlay(el) {
  menuEl.classList.add('hidden');
  overOvEl.classList.add('hidden');
  if (el) el.classList.remove('hidden');
}
function startGame() {
  moves = 0; matched = 0;
  firstIdx = -1; secondIdx = -1;
  locked = false;
  timerMs = 0;
  buildBoard();
  updateHud();
  state = 'playing';
  showOverlay(null);
  ac(); // unlock audio on user gesture
  startTimer();
}
function toMenu() {
  stopTimer();
  state = 'menu';
  boardEl.innerHTML = '';
  cards = [];
  showOverlay(menuEl);
  refreshMenu();
}
function winGame() {
  stopTimer();
  state = 'won';
  const isNew = saveBest(diff, moves);
  winTextEl.textContent = 'BOARD CLEARED';
  recordEl.classList.toggle('hidden', !isNew);
  const best = bestFor(diff);
  statTextEl.innerHTML =
    'MOVES: ' + moves + '&nbsp;&nbsp;TIME: ' + fmtTime(timerMs) + '<br>' +
    'GRID: ' + diff.toUpperCase() + '&nbsp;&nbsp;BEST MOVES: ' + best;
  showOverlay(overOvEl);
  sfxWin();
}

/* ---- card interaction ---- */
function onCard(card) {
  if (state !== 'playing' || locked) return;
  if (card.up || card.matched) return;
  const idx = cards.indexOf(card);
  card.up = true;
  card.el.classList.add('up');
  sfxFlip();

  if (firstIdx === -1) { firstIdx = idx; return; }
  secondIdx = idx;
  moves++;
  updateHud();

  const a = cards[firstIdx], b = cards[secondIdx];
  if (a.emoji === b.emoji) {
    a.matched = b.matched = true;
    matched++;
    a.el.classList.add('matched');
    b.el.classList.add('matched');
    firstIdx = -1;
    sfxMatch();
    updateHud();
    if (matched === DIFFS[diff].pairs) setTimeout(winGame, 450);
  } else {
    locked = true;
    a.el.classList.add('wrong');
    b.el.classList.add('wrong');
    sfxMismatch();
    setTimeout(() => {
      a.up = b.up = false;
      a.el.classList.remove('up', 'wrong');
      b.el.classList.remove('up', 'wrong');
      firstIdx = -1; secondIdx = -1;
      locked = false;
    }, MISMATCH_DELAY);
  }
}

/* ---- menu (mouse + keyboard navigation) ---- */
const groups = [
  { key: 'diff', row: rowDiffEl, vals: ['easy', 'medium', 'hard'], i: 1 }
];
function refreshMenu() {
  for (const g of groups) {
    const chosen = g.vals[g.i];
    for (const b of g.row.querySelectorAll('.opt')) {
      b.classList.toggle('sel', b.dataset.val === chosen);
    }
  }
  diff = groups[0].vals[groups[0].i];
  const b = bestFor(diff);
  menuBest.textContent = 'BEST: ' + (b === null ? '--' : b + ' MOVES');
}
for (const b of document.querySelectorAll('.opt')) {
  b.addEventListener('click', () => {
    groups[0].i = groups[0].vals.indexOf(b.dataset.val);
    refreshMenu(); b.blur(); ac();
  });
}

/* ---- buttons ---- */
startBtn.addEventListener('click', () => { startGame(); startBtn.blur(); });
againBtn.addEventListener('click', () => { startGame(); againBtn.blur(); });
toMenuBtn.addEventListener('click', () => { toMenu(); toMenuBtn.blur(); });

/* ---- mute ---- */
function toggleMute() {
  muted = !muted;
  muteBtn.innerHTML = muted ? '&#128263;' : '&#128266;';
  muteBtn.blur();
}
muteBtn.addEventListener('click', toggleMute);

/* ---- keyboard ---- */
window.addEventListener('keydown', (e) => {
  ac(); // unlock audio on first gesture
  if (e.code === 'KeyM') { toggleMute(); return; }
  if (e.code === 'KeyR') { if (state !== 'menu') startGame(); return; }
  if (e.code === 'Escape') { if (state !== 'menu') toMenu(); return; }
  if (state === 'menu' && (e.code === 'Enter' || e.code === 'Space') &&
      document.activeElement === document.body) {
    e.preventDefault();
    startGame();
  }
});

/* ---- test hooks (live getters; harmless in play) ---- */
window.__test = {
  get board() {
    return cards.map(c => ({ emoji: c.emoji, up: c.up, matched: c.matched }));
  },
  get moves()   { return moves; },
  get matched() { return matched; },
  get state()   { return state; },
  get diff()    { return diff; },
  get locked()  { return locked; },
  get errors()  { return (window.__errs || []).slice(); }
};

/* ---- boot ---- */
toMenu();
</script>
</body>
</html>
