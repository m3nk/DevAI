<body>
<!-- DEVAI-MENU:BEGIN -->
<style>
  #devai-tools{position:fixed;z-index:2147483000;left:10px;top:10px;display:flex;gap:8px;
    align-items:center;flex-wrap:wrap;max-width:calc(100vw - 20px)}
  #devai-tools a,#devai-tools button{display:inline-flex;align-items:center;gap:6px;
    padding:6px 12px;border-radius:999px;white-space:nowrap;
    font:600 12px/1 "Segoe UI",system-ui,-apple-system,sans-serif;letter-spacing:.4px;
    text-decoration:none;color:var(--da-fg,#dfe6f5);
    background:var(--da-bg,rgba(10,14,24,.62));border:1px solid var(--da-bd,rgba(108,140,255,.45));
    box-shadow:0 4px 14px rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    opacity:.72;transition:opacity .15s ease,transform .15s ease,background .15s ease,color .15s ease;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer;
    -webkit-appearance:none;appearance:none;font-family:inherit}
  #devai-tools a:hover,#devai-tools button:hover,#devai-tools a:focus-visible,
  #devai-tools button:focus-visible{opacity:1;transform:translateY(-1px);
    background:var(--da-bgh,rgba(28,38,68,.92))}
  #devai-tools a:active,#devai-tools button:active{transform:translateY(0)}
  #devai-tools .da-i{font-size:14px;line-height:1}
  #devai-clear.arm{opacity:1;color:#ffd9d9;border-color:rgba(255,107,107,.85);
    background:rgba(96,20,26,.82)}
  #devai-clear.done{opacity:1;color:#d6ffe9;border-color:rgba(61,220,151,.8);
    background:rgba(16,68,48,.85)}
  @media (max-width:560px){#devai-tools a,#devai-tools button{padding:8px 11px}}
  #devai-tools{--da-fg:#d9e6c8;--da-bd:rgba(120,160,90,.45)}
</style>
<div id="devai-tools">
  <a id="devai-home" href="../index.html" title="Back to the DevAI Arcade dashboard &#8212; pick another game"><span class="da-i">&#127918;</span><span class="da-t">Menu</span></a>
  <button id="devai-clear" type="button" title="Delete this game&#39;s saved data (contra_hi) from this browser"><span class="da-i">&#128465;</span><span class="da-t">Clear</span></button>
</div>
<script>
(function(){
  var T=document.getElementById('devai-tools'),B=document.getElementById('devai-clear'),
      CFG={hud:0,fitW:960,fitH:540,fitY:52},KEYS=["contra_hi"],PREF=["contra_"],t,armT,armed=0;

  /* ---- keep these controls' events out of the game's own input handlers ----
     NB: stopPropagation() in the window CAPTURE phase also prevents the target's
     own listeners, so the button's action must run here, not on the button.
     (The Menu link still navigates: that is a default action, not a listener.) */
  ['pointerdown','mousedown','mouseup','pointerup','dblclick','touchstart','touchend','contextmenu']
    .forEach(function(ev){window.addEventListener(ev,function(e){
      if(T&&T.contains(e.target))e.stopPropagation();
    },true);});
  window.addEventListener('click',function(e){
    if(!T||!T.contains(e.target))return;
    e.stopPropagation();
    var b=e.target.closest?e.target.closest('#devai-clear'):null;
    if(b)clearClicked();
  },true);
  // Space/Enter on a focused control must not shoot/flap/place a tower
  ['keydown','keyup'].forEach(function(ev){window.addEventListener(ev,function(e){
    if(T&&T.contains(document.activeElement)&&(e.key===' '||e.key==='Enter'))e.stopPropagation();
  },true);});

  /* ---- clear this game's saved data ---- */
  function label(html){B.innerHTML=html;}
  function disarm(){armed=0;clearTimeout(armT);B.classList.remove('arm');
    label('<span class="da-i">&#128465;</span><span class="da-t">Clear</span>');}
  function wipe(){
    var gone=[];
    try{
      var all=[];
      for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k)all.push(k);}
      all.forEach(function(k){
        var hit=KEYS.indexOf(k)>=0;
        if(!hit)for(var j=0;j<PREF.length;j++)if(k.indexOf(PREF[j])===0){hit=true;break;}
        if(hit){try{localStorage.removeItem(k);gone.push(k);}catch(e){}}
      });
    }catch(e){}
    return gone;
  }
  function lockWrites(){
    // Some games re-save from memory on pagehide/timer; without this the keys
    // we just deleted come back to life on the reload.
    try{ Storage.prototype.setItem=function(){/* dropped: cleared this session */}; }catch(e){}
  }
  function clearClicked(){
    if(!armed){
      armed=1;B.classList.add('arm');
      label('<span class="da-i">&#9888;</span><span class="da-t">Sure?</span>');
      armT=setTimeout(disarm,3500);
      return;
    }
    clearTimeout(armT);
    var gone=wipe();
    B.classList.remove('arm');B.classList.add('done');
    label(gone.length?'<span class="da-i">&#10003;</span><span class="da-t">Cleared '+gone.length+'</span>'
                     :'<span class="da-i">&#8709;</span><span class="da-t">Nothing saved</span>');
    if(gone.length){ lockWrites(); setTimeout(function(){location.reload();},700); }
    else setTimeout(disarm,1500);
  }

  /* ---- placement: games that paint their HUD on the canvas park below it ---- */
  function place(){
    if(!T||(!CFG.hud&&!CFG.fitW))return;
    var vw=window.innerWidth,vh=window.innerHeight,c=document.querySelector('canvas');
    var cr=c?c.getBoundingClientRect():{x:0,y:0,width:vw,height:vh};
    var h=T.offsetHeight||28,y;
    if(CFG.fitW){
      // playfield is contain-fit INSIDE a full-bleed canvas: map logical y to the screen
      var f=Math.min(cr.width/CFG.fitW,cr.height/CFG.fitH);
      y=cr.y+(cr.height-CFG.fitH*f)/2+CFG.fitY*f+6;
    }else{
      y=cr.y+cr.height*CFG.hud+6;
    }
    T.style.top=Math.round(Math.max(4,Math.min(y,vh-h-4)))+'px';
    T.style.bottom='auto';
  }
  // never schedule with requestAnimationFrame: a background tab receives zero frames
  function queue(){clearTimeout(t);t=setTimeout(place,50);}
  window.addEventListener('resize',queue);
  window.addEventListener('orientationchange',function(){setTimeout(place,150);});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)place();});
  function c0(){return document.querySelector('canvas');}
  if(window.ResizeObserver&&c0()){try{new ResizeObserver(queue).observe(c0());}catch(e){}}
  place();setTimeout(place,300);
  if(document.readyState!=='complete')window.addEventListener('load',function(){place();setTimeout(place,300);});
})();
</script>
<!-- DEVAI-MENU:END -->


<canvas id="c"></canvas>
<script>
"use strict";
/* ============================== CONFIG ============================== */
const LW=960, LH=540, TS=30, ROWS=18, STEP=1/60;
const GRAV=1900, MAXVY=950, RUNSPD=250, JUMPV=690;
const MAX_PB=300, MAX_EB=200, MAX_ENEMIES=60;
const PODK={'1':'s','2':'m','3':'l','4':'f','5':'r'};
const WPN={
  rifle:{rate:.18, spd:620, dmg:2, name:'RIFLE'},
  m:{rate:.07, spd:700, dmg:2, name:'MACHINE GUN'},
  s:{rate:.20, spd:560, dmg:2, n:5, spread:.30, name:'SPREAD'},
  l:{rate:.13, spd:920, dmg:4, pierce:true, name:'LASER'},
  f:{rate:.16, spd:430, dmg:3, wave:true, name:'FIRE'}
};
const STAGECFG=[
  {name:'JUNGLE',   skyTop:'#08111f', skyBot:'#173a24', hill:'#0c2418', mid:'#123322', ground:'#2c4a1e', gTop:'#4e8f2f', plat:'#8a6a33', bossHp:60},
  {name:'BASE',     skyTop:'#0b0d18', skyBot:'#3a1c1c', hill:'#1a1420', mid:'#241a26', ground:'#3c3a40', gTop:'#6e6a72', plat:'#7a5540', bossHp:90},
  {name:'FINAL',    skyTop:'#02040c', skyBot:'#141031', hill:'#0e0c22', mid:'#181440', ground:'#33304a', gTop:'#5e58a0', plat:'#6a5a90', bossHp:130}
];
const STAGES=[["..................................................................................................................................................................................................................", "..................................................................................................................................................................................................................", "..................................................................................................................................................................................................................", "..................................................................................................................................................................................................................", "..................................................................................................................................................................................................................", "..................................................................................................................................................................................................................", "..................................................................................................................................................................................................................", "..............................................................................................................................................................................................................T...", ".........................................................................................................................................................................................................#########", ".................................................................................................................................S.......................................................................#########", "..............................1...............S......................................S......2...................................----...5................................................................3...C.####", "............................----..............----........R...U.....................----..............U.....R.................................U...R.....----.......................................T..S....T..####", ".......................................................############.................................#############...........................#########.............................................################", "...P................U.....U.......U...............U....############.....T.......U.......R...........#############....T.......U......U.......#########......U............T...U.....R.....U.........################", "########################################...################################....#########################################...#####################################....##############################################", "########################################...################################....#########################################...#####################################....##############################################", "########################################...################################....#########################################...#####################################....##############################################", "########################################...################################....#########################################...#####################################....##############################################"], ["......................................................................................................................................................................................................................................", "......................................................................................................................................................................................................................................", "......................................................................................................................................................................................................................................", "......................................................................................................................................................................................................................................", "......................................................................................................................................................................................................................................", "......................................................................................................................................................................................................................................", "......................................................................................................................................................................................................................................", "..................................................................................................................................................................................................................................T...", ".................................................................S.............................................................................S.............................................................................#########", "................................................................----....................................----..................................----...........................................................................#########", "............................1.................................................3...................................................4.............................2...........................................................5...C.####", "..........................----............----......U...R.......................----........U...U.S...................----......U.....R.......................----........R.....T......................................T..S....T..####", "................................................#############.............................###########........................##############.............................###########...................................################", "...P..............U.....U.....R.T...........U...#############.....U.........T.............###########.R.........U.........T..##############.U.........U.................###########...U.........U.....R.....T.........################", "###################################....###############################....###############################....####################################...#####################################....#########################################", "###################################....###############################....###############################....####################################...#####################################....#########################################", "###################################....###############################....###############################....####################################...#####################################....#########################################", "###################################....###############################....###############################....####################################...#####################################....#########################################"], ["................................................................................................................................................................................................................................................", "................................................................................................................................................................................................................................................", "................................................................................................................................................................................................................................................", "................................................................................................................................................................................................................................................", "................................................................................................................................................................................................................................................", "................................................................................................................................................................................................................................................", "................................................................................................................................................................................................................................................", "............................................................................................................................................................................................................................................T...", ".......................................................................................................................................................................................................................................#########", "...................................S....................................4....................................................................S...................................S.....................................................#########", "..........................1.......----................................----...................S..........----........................3.......----........................5.......----............................2...5.....................C.####", "........................----................U.....R.......----................U.....U.......----..................U.....R.......----....................U.....R.....----................U.....R..................................T..S....T..####", "..........................................#############.....................#############.......................#############.........................###########.....................#############.............................################", "...P............U.....R...T.U.............#############.U...........T.......#############.R.........T...........#############.U.......T.........U.....###########.....U.........T.....#############.U.........T.....R...T.......################", "##############################....############################....#############################....###############################....####################################....##########################...#####################################", "##############################....############################....#############################....###############################....####################################....##########################...#####################################", "##############################....############################....#############################....###############################....####################################....##########################...#####################################", "##############################....############################....#############################....###############################....####################################....##########################...#####################################"]];

/* ============================== CANVAS / HIDPI ============================== */
const cvs=document.getElementById('c');
const ctx=cvs.getContext('2d');
let S=1, ox=0, oy=0;
function resize(){
  const dpr=Math.min(3, window.devicePixelRatio||1);
  cvs.style.width=window.innerWidth+'px'; cvs.style.height=window.innerHeight+'px';
  cvs.width=Math.round(window.innerWidth*dpr); cvs.height=Math.round(window.innerHeight*dpr);
  S=Math.min(cvs.width/LW, cvs.height/LH);
  ox=(cvs.width-LW*S)/2; oy=(cvs.height-LH*S)/2;
}
window.addEventListener('resize', resize); resize();

/* ============================== AUDIO ============================== */
let AC=null, noiseBuf=null;
function ensureAudio(){
  if(AC) return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const len=AC.sampleRate*0.4, b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    noiseBuf=b;
  }catch(e){ AC=null; }
}
function tone(f0,f1,dur,type,vol){
  if(!AC) return;
  try{
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
    o.type=type||'square'; o.frequency.setValueAtTime(Math.max(1,f0),t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    g.gain.setValueAtTime(vol||0.06,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
function noiseHit(dur,vol){
  if(!AC||!noiseBuf) return;
  try{
    const s=AC.createBufferSource(), g=AC.createGain(), t=AC.currentTime;
    s.buffer=noiseBuf; g.gain.setValueAtTime(vol||0.12,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(g); g.connect(AC.destination); s.start(t); s.stop(t+dur);
  }catch(e){}
}
const sfx={
  shoot(){ tone(900,180,0.07,'square',0.035); },
  laser(){ tone(1600,300,0.09,'sawtooth',0.03); },
  boom(){ noiseHit(0.25,0.1); tone(160,40,0.25,'triangle',0.1); },
  bigBoom(){ noiseHit(0.5,0.18); tone(90,25,0.5,'triangle',0.14); },
  jump(){ tone(240,520,0.12,'square',0.04); },
  pickup(){ tone(520,1100,0.15,'square',0.05); tone(780,1600,0.18,'square',0.03); },
  hit(){ tone(300,80,0.12,'square',0.05); },
  death(){ noiseHit(0.4,0.14); tone(400,60,0.45,'sawtooth',0.08); },
  clear(){ [660,880,1100,1320].forEach((f,i)=>setTimeout(()=>tone(f,f,0.18,'square',0.05), i*130)); },
  coreHit(){ tone(1200,400,0.05,'square',0.04); }
};

/* ============================== INPUT ============================== */
const keys=new Set();
const mouse={x:LW/2, y:LH/2, down:false};
function K(c){ return keys.has(c); }
function onKeyDown(code){
  ensureAudio();
  if(state==='title'){ if(code==='Enter') startGame(false); else if(code==='Digit2') startGame(true); }
  else if((state==='gameover'||state==='victory') && code==='Enter'){ state='title'; }
  else if(state==='playing' && code==='KeyP'){ __paused=!__paused; if(!__paused) last=performance.now(); }
}
window.addEventListener('keydown', e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if(!e.repeat) onKeyDown(e.code);
  keys.add(e.code);
});
window.addEventListener('keyup', e=>keys.delete(e.code));
function toLogical(ev){
  const r=cvs.getBoundingClientRect();
  const px=(ev.clientX-r.left)*cvs.width/r.width, py=(ev.clientY-r.top)*cvs.height/r.height;
  return { x:(px-ox)/S, y:(py-oy)/S };
}
window.addEventListener('mousemove', e=>{
  const p=toLogical(e); mouse.x=p.x; mouse.y=p.y;
  if(players[0]) players[0].aimMode='mouse';
});
window.addEventListener('mousedown', e=>{ if(e.button===0){ mouse.down=true; ensureAudio(); } });
window.addEventListener('mouseup',   e=>{ if(e.button===0) mouse.down=false; });
window.addEventListener('blur', ()=>{ keys.clear(); mouse.down=false; });

/* ============================== STATE ============================== */
let state='title';
let stageIdx=0, map=[], COLS=0, MAPW=LW;
let spawnDefs=[], podDefs=[], enemies=[], pBullets=[], eBullets=[], pods=[], capsules=[], particles=[];
let boss=null, score=0, best=0, eid=1;
const cam={x:0};
let shake=0, scT=0, goT=0, time=0;
let __paused=false;
try{ best=parseInt(localStorage.getItem('contra_hi')||'0',10)||0; }catch(e){ best=0; }
let players=[];

function tileAt(cx,cy){
  if(cx<0||cx>=COLS) return '#';
  if(cy<0||cy>=ROWS) return '.';
  return map[cy][cx];
}

/* ============================== PLAYERS ============================== */
function mkPlayer(i){
  return { i, x:90, y:300, w:20, h:34, vx:0, vy:0, onGround:false, standType:'', dropT:0,
    safeX:90, safeY:386,
    facing:1, prone:false, prevUp:false, weapon:'rifle', rapid:0, cool:0,
    inv:0, lives:3, alive:true, deadT:0, anim:0, aimMode:(i===0?'mouse':'keys'),
    aimx:1, aimy:0, aimHold:false, fireOv:false };
}
function pCX(p){ return p.x+p.w/2; }
function pCY(p){ return p.y+p.h/2; }
function findGround(x){
  for(let k=0;k<24;k++){
    const cx=Math.floor((x+k*TS*0.5)/TS);
    if(cx<1||cx>=COLS-1) continue;
    for(let cy=0;cy<ROWS;cy++){
      const t=tileAt(cx,cy);
      if(t==='#'||t==='-') return { x:cx*TS+TS/2-10, y:cy*TS-34 };
    }
  }
  return {x:x, y:0};
}
function inputVec(p){
  const co=players.length>1;
  if(p.i===0){
    return { L:K('KeyA')||(!co&&K('ArrowLeft')), R:K('KeyD')||(!co&&K('ArrowRight')),
      U:K('KeyW')||K('Space')||(!co&&K('ArrowUp')), D:K('KeyS')||(!co&&K('ArrowDown')),
      F:K('KeyJ')||mouse.down||p.fireOv };
  }
  return { L:K('ArrowLeft'), R:K('ArrowRight'), U:K('ArrowUp'), D:K('ArrowDown'),
    F:K('Comma')||K('Period')||p.fireOv };
}
function updatePlayers(dt){
  for(const p of players){
    if(!p.alive){
      p.deadT+=dt;
      if(p.lives>0 && p.deadT>1.5){
        respawnPlayer(p);
      }
      continue;
    }
    const inp=inputVec(p);
    // NOTE: movement keys never steal aim from the mouse (P1 aims at cursor, always)
    // drop-through (platforms take priority over prone)
    if(p.onGround && inp.D && p.standType==='-') p.dropT=0.28;
    // prone
    const wantProne = p.onGround && inp.D && !inp.U && p.standType!=='-';
    if(wantProne!==p.prone){
      const nh=wantProne?16:34;
      p.y += p.h-nh; p.h=nh; p.prone=wantProne;
    }
    // horizontal
    const mv=(inp.R?1:0)-(inp.L?1:0);
    p.vx = mv*RUNSPD*(p.prone?0.35:1);
    if(mv) p.facing=mv;
    // jump (buffered: a press within ~7 ticks of landing still fires)
    if(inp.U && !p.prevUp) p.bufT=0.12; else p.bufT=Math.max(0,(p.bufT||0)-dt);
    if(p.bufT>0 && p.onGround && !p.prone){ p.vy=-JUMPV; p.onGround=false; p.bufT=0; sfx.jump(); }
    p.prevUp=inp.U;
    p.dropT=Math.max(0,p.dropT-dt);
    moveBody(p,dt,p.dropT>0);
    if(p.onGround){ p.safeX=p.x; p.safeY=p.y; }
    if(p.inv>0) p.inv-=dt;
    if(p.cool>0) p.cool-=dt;
    p.x=Math.max(cam.x+4, Math.min(p.x, cam.x+LW-p.w-4));
    p.x=Math.max(4, Math.min(p.x, MAPW-p.w-4));
    if(p.y>LH+40){ killPlayer(p, true); continue; }   // pits are lethal even mid-invuln
    if(Math.abs(p.vx)>10) p.anim+=dt*10; 
    // aim
    if(inp.L||inp.R||inp.U||inp.D) p.aimHold=false;
    if(p.i===0 && p.aimMode==='mouse'){
      const a=Math.atan2(mouse.y-pCY(p), (mouse.x+cam.x)-pCX(p));   // cursor is SCREEN space; player is WORLD space
      p.aimx=Math.cos(a); p.aimy=Math.sin(a);
      if(Math.abs(p.aimx)>0.2) p.facing=p.aimx>0?1:-1;
    }else if(!p.aimHold){
      let ax=(inp.R?1:0)-(inp.L?1:0), ay=(inp.D?1:0)-(inp.U?1:0);
      if(p.prone){ ay=0; ax=p.facing; }
      if(ax===0&&ay===0) ax=p.facing;
      else if(ax) p.facing=ax>0?1:-1;
      const a=Math.atan2(ay,ax), q=Math.round(a/(Math.PI/4))*(Math.PI/4);
      p.aimx=Math.cos(q); p.aimy=Math.sin(q);
    }
    // fire
    if(inp.F && p.cool<=0) firePlayer(p);
  }
}
function respawnPlayer(p){
  // respawn at the last spot the player actually stood on (clamped into view)
  let sx = p.safeX, sy = p.safeY;
  if (sx < cam.x+20 || sx > cam.x+LW-60){
    const g = findGround(cam.x+140); sx = g.x; sy = g.y;
  }
  p.x=sx; p.y=sy; p.vx=0; p.vy=-500; p.alive=true; p.deadT=0;   // respawn hop: clears a pit you just fell in
  p.inv=2; p.weapon='rifle'; p.rapid=0; p.prone=false; p.h=34; p.cool=0;
}
let overT=0;
function killPlayer(p, force){
  if(!p.alive || (p.inv>0 && !force)) return;
  p.alive=false; p.deadT=0; p.lives--; p.prone=false; p.h=34;
  boom(pCX(p),pCY(p),28,'#ffdd55'); sfx.death(); shake=Math.max(shake,8);
}
function queueGameOver(){
  setTimeout(()=>{ if(state==='playing' && players.every(pl=>!pl.alive&&pl.lives<=0)){ saveBest(); state='gameover'; goT=0; } }, 1200);
}

/* ============================== PHYSICS ============================== */
function rectsOverlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function moveBody(e,dt,ignorePlat){
  // X axis
  e.x+=e.vx*dt;
  let x0=Math.floor(e.x/TS), x1=Math.floor((e.x+e.w-1)/TS);
  let y0=Math.floor(e.y/TS), y1=Math.floor((e.y+e.h-1)/TS);
  for(let cy=y0;cy<=y1;cy++){
    if(tileAt(x0,cy)==='#'){ e.x=(x0+1)*TS; e.vx=0; }
    if(tileAt(x1,cy)==='#'){ e.x=x1*TS-e.w; e.vx=0; }
  }
  // Y axis
  const prevBottom=e.y+e.h;
  e.vy=Math.min(MAXVY, e.vy+GRAV*dt);
  e.y+=e.vy*dt;
  e.onGround=false; e.standType='';
  x0=Math.floor(e.x/TS); x1=Math.floor((e.x+e.w-1)/TS);
  y0=Math.floor(e.y/TS); y1=Math.floor((e.y+e.h-1)/TS);
  if(e.vy>=0){
    for(let cx=x0;cx<=x1;cx++){
      const t=tileAt(cx,y1);
      if(t==='#'){ e.y=y1*TS-e.h; e.vy=0; e.onGround=true; e.standType='#'; }
      else if(t==='-' && !ignorePlat && prevBottom<=y1*TS+4){ e.y=y1*TS-e.h; e.vy=0; e.onGround=true; e.standType='-'; }
    }
  }else{
    for(let cx=x0;cx<=x1;cx++){
      if(tileAt(cx,y0)==='#'){ e.y=(y0+1)*TS; e.vy=0; }
    }
  }
  // foot sensor: standing causes 0.5px gravity bounce off the snap line each
  // frame, which flickers onGround ~every other tick and eats key presses.
  // Probe 2px below the feet so a grounded body reads grounded every tick.
  if(!e.onGround && e.vy>=0){
    const sy=Math.floor((e.y+e.h+2)/TS);
    for(let cx=x0;cx<=x1;cx++){
      const t=tileAt(cx,sy);
      if(t==='#'){ e.y=sy*TS-e.h; e.vy=0; e.onGround=true; e.standType='#'; break; }
      if(t==='-' && !ignorePlat && prevBottom<=sy*TS+4){ e.y=sy*TS-e.h; e.vy=0; e.onGround=true; e.standType='-'; break; }
    }
  }
}

/* ============================== SHOOTING ============================== */
function firePlayer(p){
  const w=WPN[p.weapon];
  const rate=w.rate/(1+0.3*p.rapid);
  p.cool=rate;
  const mx=pCX(p)+p.aimx*18, my=pCY(p)-2+p.aimy*18;
  const base=Math.atan2(p.aimy,p.aimx);
  const n=w.n||1, spread=w.spread||0;
  for(let k=0;k<n;k++){
    if(pBullets.length>=MAX_PB) return;   // hard cap inside spawn fn
    const a=n>1 ? base + (k-(n-1)/2)*spread : base;
    const b={ x:mx, y:my, r:4, dmg:w.dmg, pierce:!!w.pierce, wave:!!w.wave, life:2.2, hitIds:new Set(),
      dx:Math.cos(a), dy:Math.sin(a), spd:w.spd, t:0, ox:mx, oy:my, kind:p.weapon };
    if(!w.wave){ b.vx=Math.cos(a)*w.spd; b.vy=Math.sin(a)*w.spd; }
    pBullets.push(b);
  }
  if(p.weapon==='l') sfx.laser(); else sfx.shoot();
  particles.push({type:'spark', x:mx, y:my, life:0.05, maxLife:0.05, r:6});
}
const EBSPEED=0.75;   // global enemy bullet speed factor (dodgeability tuning)
function enemyShoot(e,ang,spd,r,c){
  if(eBullets.length>=MAX_EB) return;
  spd*=EBSPEED;
  eBullets.push({ x:e.x+e.w/2, y:e.y+e.h/2, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, r:r||5, c:c||'#ff6644', life:4 });
}

/* ============================== ENEMIES ============================== */
const ETYPE={
  U:{w:22,h:32,hp:3, mover:true,  score:100},
  R:{w:22,h:32,hp:4, mover:true,  score:150},
  T:{w:30,h:24,hp:8, mover:false, score:200},
  S:{w:18,h:28,hp:3, mover:false, score:150}
};
function makeEnemy(type,x,y,bossT){
  const t=ETYPE[type];
  return { id:eid++, type, x:x-t.w/2, y:y-t.h, w:t.w, h:t.h, vx:0, vy:0, onGround:false, standType:'',
    hp:t.hp*(1+stageIdx*0.5)|0 || t.hp, mover:t.mover, cool:0.6+Math.random()*0.8, tel:0, bossT:!!bossT, flash:0, anim:Math.random()*6 };
}
function nearestPlayer(e){
  let bestP=null, bd=1e18;
  for(const p of players){ if(!p.alive) continue; const d=(pCX(p)-e.x)**2+(pCY(p)-e.y)**2; if(d<bd){bd=d;bestP=p;} }
  return bestP;
}
const multFire=()=>1+stageIdx*0.25;
function updateEnemies(dt){
  for(const e of enemies){
    if(e.flash>0) e.flash-=dt;
    const p=nearestPlayer(e);
    if(e.mover){
      if(p){
        const dir=pCX(p)>pCX(e)?1:-1;
        if(e.type==='U'){
          e.vx=dir*150*(1+stageIdx*0.2);
          if(e.onGround && (Math.abs(pCY(p)-p.y)>60 && Math.abs(pCX(p)-pCX(e))<160 && Math.random()<0.02)) e.vy=-620;
        }else{ // rifleman: keep distance, shoot
          const dx=pCX(p)-pCX(e);
          e.vx = Math.abs(dx)>280 ? dir*90 : (Math.abs(dx)<150 ? -dir*70 : 0);
          e.cool-=dt;
          if(e.cool<=0 && Math.abs(dx)<520){
            e.cool=1.5/multFire();
            const a=Math.atan2(pCY(p)-(e.y+8), pCX(p)-pCX(e));
            enemyShoot(e,a,330,5,'#ffaa44');
          }
        }
        if(e.vx) e.anim+=dt*8;
      }else e.vx=0;
      moveBody(e,dt,false);
      if(e.mover && e.onGround && Math.abs(e.vx)>10 && Math.random()<0.004) e.vy=-560;
    }else{
      if(!p) continue;
      e.cool-=dt;
      if(e.type==='T'){
        if(e.cool<=0){
          e.cool=(e.bossT?1.3:1.8)/multFire();
          const a=Math.atan2(pCY(p)-(e.y+e.h/2), pCX(p)-(e.x+e.w/2));
          const fan=e.bossT?5:3;
          for(let k=0;k<fan;k++) enemyShoot(e, a+(k-(fan-1)/2)*0.22, 300,5,'#ff5533');
        }
      }else{ // sniper: telegraph then fast shot
        if(e.tel>0){
          e.tel-=dt;
          if(e.tel<=0 && e.cool<=0){
            const a=Math.atan2(pCY(p)-(e.y+6), pCX(p)-(e.x+e.w/2));
            enemyShoot(e,a,640,4,'#ffee55');
            e.cool=2.2/multFire();
          }
        }else if(e.cool<=0){ e.tel=0.55; }
      }
    }
    // contact damage
    for(const pl of players){
      if(pl.alive && pl.inv<=0 && rectsOverlap(e,{x:pl.x,y:pl.y,w:pl.w,h:pl.h})) killPlayer(pl);
    }
  }
  enemies=enemies.filter(e=>e.hp>0 && e.x>cam.x-500 && e.x<cam.x+LW+900);
}
function hurtEnemy(e,dmg){
  e.hp-=dmg; e.flash=0.08;
  if(e.hp<=0){
    score+=ETYPE[e.type].score*(e.bossT?3:1);
    boom(e.x+e.w/2,e.y+e.h/2,20,'#ff9944'); sfx.boom();
  }
}

/* ============================== BULLETS ============================== */
function updateBullets(dt){
  for(const b of pBullets){
    if(b.wave){
      b.t+=dt;
      const wob=Math.sin(b.t*14+b.ox%1)*26*Math.min(1,b.t*5);
      b.x=b.ox+b.dx*b.spd*b.t + (-b.dy)*wob;
      b.y=b.oy+b.dy*b.spd*b.t + (b.dx)*wob;
    }else{ b.x+=b.vx*dt; b.y+=b.vy*dt; }
    b.life-=dt;
    if(b.life<=0 || b.x<cam.x-120 || b.x>cam.x+LW+120 || b.y<-60 || b.y>LH+60){ b.dead=true; continue; }
    if(tileAt(Math.floor(b.x/TS),Math.floor(b.y/TS))==='#'){ b.dead=true; particles.push({type:'spark',x:b.x,y:b.y,life:0.1,maxLife:0.1,r:7}); continue; }
    // boss core
    if(boss && !boss.dead){
      const cb={x:boss.x-28,y:boss.y-28,w:56,h:56};
      if(b.x>cb.x&&b.x<cb.x+cb.w&&b.y>cb.y&&b.y<cb.y+cb.h){
        boss.hp-=b.dmg; boss.flash=0.08; sfx.coreHit();
        particles.push({type:'spark',x:b.x,y:b.y,life:0.12,maxLife:0.12,r:10});
        if(!b.pierce) b.dead=true;
        if(boss.hp<=0) killBoss();
        continue;
      }
    }
    for(const e of enemies){
      if(e.hp<=0) continue;
      if(b.x>e.x-b.r && b.x<e.x+e.w+b.r && b.y>e.y-b.r && b.y<e.y+e.h+b.r){
        if(b.pierce){ if(b.hitIds.has(e.id)) continue; b.hitIds.add(e.id); }
        else b.dead=true;
        hurtEnemy(e,b.dmg);
        if(!b.pierce) break;
      }
    }
  }
  pBullets=pBullets.filter(b=>!b.dead);
  for(const b of eBullets){
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    if(b.life<=0 || b.x<cam.x-120 || b.x>cam.x+LW+120 || b.y<-60 || b.y>LH+60){ b.dead=true; continue; }
    if(tileAt(Math.floor(b.x/TS),Math.floor(b.y/TS))==='#'){ b.dead=true; continue; }
    for(const p of players){
      if(p.alive && p.inv<=0 && b.x>p.x-b.r && b.x<p.x+p.w+b.r && b.y>p.y-b.r && b.y<p.y+p.h+b.r){
        b.dead=true; killPlayer(p); break;
      }
    }
  }
  eBullets=eBullets.filter(b=>!b.dead);
}

/* ============================== PODS & PICKUPS ============================== */
function updatePods(dt){
  for(const pd of pods){
    pd.t+=dt;
    pd.x-=90*dt;
    pd.y=pd.baseY+Math.sin(pd.t*3)*70;
    if(pd.x<cam.x-60) pd.dead=true;
    // shot?
    for(const b of pBullets){
      if(!b.dead && Math.abs(b.x-pd.x)<16 && Math.abs(b.y-pd.y)<14){
        b.dead=true; pd.dead=true;
        capsules.push({kind:pd.kind, x:pd.x, y:pd.y, bob:0});
        score+=500; boom(pd.x,pd.y,16,'#ffffff'); sfx.pickup();
        break;
      }
    }
    if(!pd.dead){
      for(const p of players){
        if(p.alive && Math.abs(pCX(p)-pd.x)<20 && Math.abs(pCY(p)-pd.y)<22){
          pd.dead=true; capsules.push({kind:pd.kind, x:pd.x, y:pd.y, bob:0}); boom(pd.x,pd.y,14,'#ffffff');
          break;
        }
      }
    }
  }
  pods=pods.filter(p=>!p.dead);
  for(const cp of capsules){
    cp.bob+=dt;
    for(const p of players){
      if(p.alive && Math.abs(pCX(p)-cp.x)<20 && Math.abs(pCY(p)-cp.y)<24){
        cp.dead=true; applyWeapon(p,cp.kind); break;
      }
    }
    if(cp.x<cam.x-80) cp.dead=true;
  }
  capsules=capsules.filter(c=>!c.dead);
}
function applyWeapon(p,kind){
  if(kind==='r'){ p.rapid=Math.min(3,p.rapid+1); }
  else p.weapon=kind;
  p.cool=0; sfx.pickup();
  particles.push({type:'text', x:pCX(p), y:p.y-14, life:0.9, maxLife:0.9, txt: kind==='r'?'RAPID x'+p.rapid:WPN[kind].name});
}

/* ============================== BOSS ============================== */
function killBoss(){
  if(!boss || boss.dead) return;
  boss.dead=true; boss.hp=0;
  score+=2000; shake=14; sfx.bigBoom();
  killAllFx();
  state='stageclear'; scT=0; sfx.clear();
}
function killAllFx(){
  for(const e of enemies) boom(e.x+e.w/2,e.y+e.h/2,18,'#ff9944');
  enemies=[]; eBullets=[];
}

/* ============================== SPAWNS & CAMERA ============================== */
function checkSpawns(){
  if(state!=='playing') return;
  const inBossZone=(x)=> boss && !boss.dead && x>=boss.x-720;
  for(const d of spawnDefs){
    if(d.done) continue;
    if(d.x<cam.x+LW+40 && d.x>cam.x-60){
      d.done=true;
      if(enemies.length<MAX_ENEMIES) enemies.push(makeEnemy(d.type,d.x,d.y,inBossZone(d.x)));
    }
  }
  for(const d of podDefs){
    if(d.done) continue;
    if(d.x<cam.x+LW+20){ d.done=true; pods.push({kind:d.kind, x:cam.x+LW+30, baseY:d.y, y:d.y, t:0}); }
  }
}
function updateCam(dt){
  const al=players.filter(p=>p.alive);
  const ps=al.length?al:players;
  let target;
  if(ps.length>1) target=(pCX(ps[0])+pCX(ps[1]))/2 - LW/2;
  else target=pCX(ps[0]) - LW*0.45;
  if(boss && !boss.dead) target=Math.min(target, boss.x-560);
  target=Math.max(0, Math.min(target, MAPW-LW));
  cam.x += (target-cam.x)*Math.min(1, dt*6);
}

/* ============================== PARTICLES ============================== */
function boom(x,y,r,c){
  particles.push({type:'boom', x, y, r:2, maxR:r, v:r/6, expand:true, life:0.5, maxLife:0.5, c:c||'#ffcc44'});
  for(let k=0;k<6;k++){
    const a=Math.random()*Math.PI*2, sp=60+Math.random()*160;
    particles.push({type:'spark', x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-60, life:0.35+Math.random()*0.25, maxLife:0.6, r:3});
  }
}
function updateParticles(dt){
  for(const q of particles){
    q.life-=dt;
    if(q.type==='boom'){
      // explicit one-way expand -> shrink (never oscillates)
      if(q.expand){ q.r+=q.v*dt*8; if(q.r>=q.maxR){ q.r=q.maxR; q.expand=false; } }
      else q.r-=q.maxR*dt/0.25;
    }else if(q.vx!==undefined){ q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=GRAV*0.35*dt; }
  }
  particles=particles.filter(q=>q.life>0 && (q.type!=='boom'||q.r>0));
}

/* ============================== STAGES ============================== */
function loadStage(i){
  stageIdx=i;
  map=STAGES[i]; COLS=map[0].length; MAPW=COLS*TS;
  spawnDefs=[]; podDefs=[]; enemies=[]; pBullets=[]; eBullets=[]; pods=[]; capsules=[]; particles=[];
  boss=null;
  let sp={x:90,y:380};
  for(let r=0;r<ROWS;r++){
    const row=map[r];
    for(let c=0;c<COLS;c++){
      const t=row[c];
      if(t==='P') sp={x:c*TS+5, y:r*TS+TS-34};
      else if(t==='U'||t==='R'||t==='T'||t==='S') spawnDefs.push({type:t, x:c*TS+TS/2, y:r*TS+TS, done:false});
      else if(PODK[t]) podDefs.push({kind:PODK[t], x:c*TS, y:r*TS+TS/2, done:false});
      else if(t==='C') boss={x:c*TS+TS, y:r*TS+TS, hp:STAGECFG[i].bossHp, maxHp:STAGECFG[i].bossHp, dead:false, flash:0};
    }
  }
  for(let k=0;k<players.length;k++){
    const p=players[k];
    p.x=sp.x+(k?36:0); p.y=sp.y; p.vx=0; p.vy=0; p.alive=true; p.deadT=0;
    p.safeX=p.x; p.safeY=p.y;
    p.inv=2; p.prone=false; p.h=34; p.cool=0;
    if(k===0) p.weapon='rifle'; // carry-over for P2 handled below
  }
  cam.x=0; shake=0;
}
function startGame(coop){
  score=0; overT=0;
  players=[mkPlayer(0)];
  if(coop) players.push(mkPlayer(1));
  loadStage(0);
  state='playing';
}
function advanceStage(){
  stageIdx++;
  if(stageIdx>=STAGES.length){ saveBest(); state='victory'; goT=0; }
  else {
    const carry=players.map(p=>p.weapon), carryR=players.map(p=>p.rapid);
    loadStage(stageIdx);
    players.forEach((p,k)=>{ p.weapon=carry[k]||'rifle'; p.rapid=carryR[k]||0; });
    state='playing';
  }
}
function saveBest(){
  if(score>best){ best=score; try{ localStorage.setItem('contra_hi',String(best)); }catch(e){} }
}

/* ============================== MAIN UPDATE ============================== */
function update(){
  const dt=STEP;
  time+=dt;
  updateParticles(dt);
  if(shake>0) shake=Math.max(0,shake-dt*30);
  if(state==='playing'){
    updatePlayers(dt); updateEnemies(dt); updateBullets(dt); updatePods(dt);
    if(boss && boss.flash>0) boss.flash-=dt;
    checkSpawns(); updateCam(dt);
    if(players.length && players.every(pl=>!pl.alive && pl.lives<=0)){
      overT+=dt;
      if(overT>1.2){ saveBest(); state='gameover'; goT=0; overT=0; }
    } else overT=0;
  }else if(state==='stageclear'){
    scT+=dt;
    updatePlayers(dt); updateBullets(dt); updateEnemies(dt); updateCam(dt);
    if(boss && scT<2.6 && Math.random()<0.3)
      boom(boss.x-60+Math.random()*140, boss.y-80+Math.random()*160, 22, Math.random()<0.5?'#ffcc44':'#ff7733');
    if(scT>3.4) advanceStage();
  }else if(state==='gameover'||state==='victory'){ goT+=dt; }
}

/* ============================== DRAW ============================== */
function hash1(n){ const s=Math.sin(n*127.1+311.7)*43758.5453; return s-Math.floor(s); }
function drawBg(){
  const cfg=STAGECFG[Math.min(stageIdx,STAGECFG.length-1)];
  let g=ctx.createLinearGradient(0,0,0,LH);
  g.addColorStop(0,cfg.skyTop); g.addColorStop(1,cfg.skyBot);
  ctx.fillStyle=g;
  // cover whole window incl letterbox (WRECT trick)
  ctx.fillRect(-ox/S,-oy/S,cvs.width/S,cvs.height/S);
  if(stageIdx===2){ // stars
    ctx.fillStyle='rgba(255,255,255,0.7)';
    for(let i=0;i<50;i++){
      const sx=((hash1(i)*LW*3 - cam.x*0.1)%(LW+80)+LW+80)%(LW+80)-40;
      ctx.fillRect(sx, hash1(i+99)*LH*0.6, 2, 2);
    }
  }
  // far hills
  ctx.fillStyle=cfg.hill;
  ctx.beginPath(); ctx.moveTo(-10,LH);
  for(let x=-10;x<=LW+10;x+=16){
    const wx=x+cam.x*0.2;
    ctx.lineTo(x, LH*0.55+Math.sin(wx*0.004)*60+Math.sin(wx*0.011)*25);
  }
  ctx.lineTo(LW+10,LH); ctx.fill();
  // mid layer: trees / buildings / spikes
  ctx.fillStyle=cfg.mid;
  const off=cam.x*0.5;
  for(let i=Math.floor(off/90)-1;i<(off+LW)/90+1;i++){
    const x=i*90-off, hgt=70+hash1(i)*90;
    if(stageIdx===0){ // trees
      ctx.fillRect(x+18, LH-hgt, 8, hgt);
      ctx.beginPath(); ctx.arc(x+22, LH-hgt, 26+hash1(i+5)*12, 0, Math.PI*2); ctx.fill();
    }else if(stageIdx===1){ // buildings
      ctx.fillRect(x, LH-hgt-40, 60, hgt+40);
      ctx.fillStyle='#4a2a2a';
      for(let wy=LH-hgt-24;wy<LH-30;wy+=26) for(let wx2=x+8;wx2<x+52;wx2+=18) ctx.fillRect(wx2,wy,8,10);
      ctx.fillStyle=cfg.mid;
    }else{ // ice spikes
      ctx.beginPath(); ctx.moveTo(x,LH); ctx.lineTo(x+25,LH-hgt-30); ctx.lineTo(x+50,LH); ctx.fill();
    }
  }
}
function drawTiles(){
  const cfg=STAGECFG[Math.min(stageIdx,STAGECFG.length-1)];
  const c0=Math.max(0,Math.floor(cam.x/TS)-1), c1=Math.min(COLS-1,Math.ceil((cam.x+LW)/TS));
  for(let cy=0;cy<ROWS;cy++){
    const row=map[cy];
    for(let cx=c0;cx<=c1;cx++){
      const t=row[cx];
      if(t!=='#'&&t!=='-') continue;
      const x=cx*TS-cam.x, y=cy*TS;
      if(t==='#'){
        ctx.fillStyle=cfg.ground; ctx.fillRect(x,y,TS,TS);
        if(row[cx-1]!=='#'){ ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(x,y,3,TS); }
        if(row[cx+1]!=='#'){ ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(x+TS-3,y,3,TS); }
        if(cy===0||map[cy-1][cx]!=='#'){ ctx.fillStyle=cfg.gTop; ctx.fillRect(x,y,TS,7); }
        if(hash1(cx*31+cy*7)>0.75){ ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.fillRect(x+8,y+12,7,6); }
      }else{
        ctx.fillStyle=cfg.plat; ctx.fillRect(x,y,TS,9);
        ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.fillRect(x,y,TS,3);
      }
    }
  }
}
function drawBoss(){
  if(!boss) return;
  const x=boss.x-cam.x, y=boss.y;
  if(boss.dead) return;
  const pulse=1+Math.sin(time*6)*0.12;
  ctx.fillStyle='#22202a'; ctx.fillRect(x-34,y-34,68,68);
  ctx.fillStyle=boss.flash>0?'#ffffff':'#ff9a2e';
  ctx.beginPath(); ctx.arc(x,y,22*pulse,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffe37a';
  ctx.beginPath(); ctx.arc(x,y,11*pulse,0,Math.PI*2); ctx.fill();
  // hp bar
  if(cam.x > boss.x-560-200){
    const bw=420, bx=(LW-bw)/2;
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(bx-4,30,bw+8,18);
    ctx.fillStyle='#802020'; ctx.fillRect(bx,34,bw,10);
    ctx.fillStyle='#ff4040'; ctx.fillRect(bx,34,bw*Math.max(0,boss.hp/boss.maxHp),10);
  }
}
function drawShadow(cx, feetY, r){
  ctx.fillStyle='rgba(0,0,0,0.32)';
  ctx.beginPath(); ctx.ellipse(cx, feetY+1, r, 3, 0, 0, Math.PI*2); ctx.fill();
}
function limb(x1,y1,x2,y2,w,col){
  ctx.strokeStyle=col; ctx.lineCap='round'; ctx.lineWidth=w;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.lineWidth=1; ctx.lineCap='butt';
}
// Shared soldier painter. x,y = hitbox top-left; o:{facing,aim,phase,grounded,flash,lean,
//   suit,suit2,skin,helm,band,gun,gunTip,muzzle}
function drawSoldier(x,y,w,h,o){
  const cx=x+w/2, f=o.facing||1, ph=o.phase||0, C=c=>o.flash?'#fff':c;
  const hipY=y+h*0.60, shY=y+h*0.34, headY=y+h*0.16;
  drawShadow(cx, y+h, w*0.60);
  const air=!o.grounded, sw=air?1.2:Math.sin(ph);
  // legs (thighs dark, boots darker): swing from hip, planted when idle
  const k1=sw*(air?4:6), k2=-sw*(air?4:6);
  limb(cx-2,hipY, cx-4+k1, y+h-4, 5, C(o.suit2||o.suit));
  limb(cx+2,hipY, cx+4+k2, y+h-4, 5, C(o.suit2||o.suit));
  limb(cx-4+k1, y+h-4, cx-4+k1*1.3, y+h-1, 4, C('#20201e'));
  limb(cx+4+k2, y+h-4, cx+4+k2*1.3, y+h-1, 4, C('#20201e'));
  ctx.save();
  if(o.lean){ ctx.translate(cx,(shY+hipY)/2); ctx.rotate(o.lean*f); ctx.translate(-cx,-(shY+hipY)/2); }
  // torso: tapered vest with gradient + strap
  const g=ctx.createLinearGradient(cx-7,0,cx+7,0);
  g.addColorStop(0,C(o.suit2||o.suit)); g.addColorStop(0.45,C(o.suit)); g.addColorStop(1,C(o.suit2||o.suit));
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(cx-6.5,shY+1); ctx.quadraticCurveTo(cx,shY-2,cx+6.5,shY+1);
  ctx.quadraticCurveTo(cx+6,hipY-2,cx+4.5,hipY+2);
  ctx.lineTo(cx-4.5,hipY+2);
  ctx.quadraticCurveTo(cx-6,hipY-2,cx-6.5,shY+1); ctx.fill();
  ctx.strokeStyle=C('rgba(0,0,0,0.35)'); ctx.stroke();
  if(!o.flash){ ctx.strokeStyle='rgba(30,25,15,0.55)'; ctx.lineWidth=1.6;            // ammo strap
    ctx.beginPath(); ctx.moveTo(cx-5*f,shY+2); ctx.lineTo(cx+5*f,hipY-1); ctx.stroke(); ctx.lineWidth=1; }
  // backpack behind
  ctx.fillStyle=C('#2c3325'); ctx.fillRect(cx-(f>0?8:4), shY+2, 4, 9);
  // head: neck, skin, helmet dome + brim, optional band with trailing tail
  limb(cx,shY+1,cx,headY+3,3,C(o.skin));
  ctx.fillStyle=C(o.skin);
  ctx.beginPath(); ctx.arc(cx,headY,4.6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=C(o.helm);
  ctx.beginPath(); ctx.arc(cx,headY-0.6,5.2,Math.PI,0); ctx.lineTo(cx+5.6,headY+1); ctx.lineTo(cx-5.6,headY+1); ctx.fill();
  if(o.band && !o.flash){
    ctx.fillStyle=C(o.band); ctx.fillRect(cx-5,headY-1.5,10,2.4);
    const wob=Math.sin(time*9+x)*2;
    ctx.beginPath(); ctx.moveTo(cx-5*f,headY-0.5);
    ctx.quadraticCurveTo(cx-11*f, headY+1+wob, cx-15*f, headY+4+wob);
    ctx.lineTo(cx-11*f, headY+2.5+wob); ctx.quadraticCurveTo(cx-8*f, headY+1.5, cx-5*f, headY+1.6); ctx.fill();
  }
  ctx.restore();
  // gun + arms rotate around shoulder toward aim
  const angL = f>0 ? (o.aim||0) : Math.PI-(o.aim||0);
  const sxp=cx+f*2.5, syp=shY+3, gl=o.gun||16;
  ctx.save(); ctx.translate(sxp,syp); ctx.rotate(angL);
  ctx.fillStyle=C('#26262e'); ctx.fillRect(0,-1.6,gl,3.2);
  ctx.fillStyle=C('#3c3c46'); ctx.fillRect(gl*0.55,-2.4,gl*0.28,1.4);
  ctx.fillStyle=C('#1a1a20'); ctx.fillRect(gl*0.34,1,4,5);                        // magazine
  limb(1,0, gl*0.5, 2.5, 3.4, C(o.skin==='#d9a06b'?'#b98a58':(o.suit2||o.suit)));   // support arm
  limb(1,0, gl*0.22, -1.2, 3.4, C(o.suit2||o.suit));                                 // trigger arm
  if(o.muzzle && !o.flash){
    ctx.fillStyle='rgba(255,220,120,0.95)';
    ctx.beginPath(); ctx.moveTo(gl+1,0); ctx.lineTo(gl+8,-3.5); ctx.lineTo(gl+11,0); ctx.lineTo(gl+8,3.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(255,255,220,0.9)';
    ctx.beginPath(); ctx.arc(gl+2,0,2,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
function drawEnemy(e){
  const x=e.x-cam.x, y=e.y;
  const flash=e.flash>0;
  if(e.type==='U'){
    drawSoldier(x,y,e.w,e.h,{facing:(nearestPlayer(e)?(pCX(nearestPlayer(e))>e.x?1:-1):-1),
      suit:'#3f6b3a', suit2:'#2e4f2b', skin:'#c98f5f', helm:'#37502f', band:'#a03030',
      phase:time*11+e.anim, grounded:e.onGround, flash, lean:0.14, gun:13, aim:-0.12});
  }else if(e.type==='R'){
    const p=nearestPlayer(e), f=p?(pCX(p)>e.x+e.w/2?1:-1):1;
    const a=p?Math.atan2(pCY(p)-(y+e.h*0.36), (pCX(p)-cam.x)-(x+e.w/2)):0;
    drawSoldier(x,y,e.w,e.h,{facing:f, suit:'#8a7a4a', suit2:'#6b5d33', skin:'#b98a58', helm:'#5f5a35',
      phase:time*6+e.anim, grounded:e.onGround, flash, gun:17, aim:a, muzzle:e.cool>(1.5/multFire())-0.08});
  }else if(e.type==='T'){
    const p=nearestPlayer(e), f=p?(pCX(p)>e.x+e.w/2?1:-1):-1;
    const cx=x+e.w/2, by=y+e.h;
    drawShadow(cx, by, 16);
    // base plate + bolts
    ctx.fillStyle=flash?'#fff':'#31343e'; ctx.fillRect(x-2,y+14,e.w+4,10);
    ctx.fillStyle=flash?'#fff':'#22242c';
    ctx.fillRect(x,y+22,e.w,2);
    // armored housing with panel gradient
    const g=ctx.createLinearGradient(cx-15,y,cx+15,y+14);
    g.addColorStop(0,flash?'#fff':'#4a4e5a'); g.addColorStop(0.5,flash?'#fff':'#6d7280'); g.addColorStop(1,flash?'#fff':'#3d4049');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.moveTo(cx-13,y+15); ctx.lineTo(cx-10,y+4); ctx.lineTo(cx+10,y+4); ctx.lineTo(cx+13,y+15); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.4)'; ctx.stroke();
    // dome + sensor eye
    ctx.fillStyle=flash?'#fff':(e.bossT?'#7a2020':'#5a5e6b');
    ctx.beginPath(); ctx.arc(cx,y+5,10,Math.PI,0); ctx.fill();
    ctx.fillStyle=flash?'#fff':(e.bossT?'#ff5050':'#30303a');
    ctx.beginPath(); ctx.arc(cx,y+3,4+Math.sin(time*8)*1.2,0,Math.PI*2); ctx.fill();
    if(!flash){ ctx.fillStyle='rgba(255,120,90,0.8)'; ctx.beginPath(); ctx.arc(cx,y+3,1.6,0,Math.PI*2); ctx.fill(); }
    // barrel tracks the player, with muzzle brake
    const a=p?Math.atan2(pCY(p)-(y+8),(pCX(p)-cam.x)-cx):0;
    ctx.save(); ctx.translate(cx,y+7); ctx.rotate(Math.max(-0.3,Math.min(0.05,a)));
    ctx.fillStyle=flash?'#fff':'#2a2c34'; ctx.fillRect(0,-2,20,4);
    ctx.fillStyle=flash?'#fff':'#44474f'; ctx.fillRect(16,-3,4,6);
    ctx.restore();
  }else{ // S sniper, kneeling
    const p=nearestPlayer(e), f=p?(pCX(p)>e.x+e.w/2?1:-1):-1;
    const C=c=>flash?'#fff':c;
    drawShadow(x+e.w/2, y+e.h, 11);
    // kneeling legs: front knee up, back leg folded
    limb(x+6,y+16, x+3,y+e.h-1, 4.6, C('#4c4650'));
    limb(x+9,y+16, x+14,y+22, 4.6, C('#4c4650'));
    limb(x+14,y+22, x+13,y+e.h-1, 4, C('#20201e'));
    // torso leaning forward
    ctx.fillStyle=C('#4e564c');
    ctx.beginPath(); ctx.moveTo(x+3,y+8); ctx.quadraticCurveTo(x+9,y+5,x+14,y+9);
    ctx.lineTo(x+12,y+18); ctx.lineTo(x+5,y+18); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.stroke();
    // hooded head on the neck, biased toward facing
    const hx=x+e.w/2+f*2.5, hy=y+5.5;
    ctx.fillStyle=C('#414a41');
    ctx.beginPath(); ctx.arc(hx,hy,4.8,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=C('#20241f');
    ctx.beginPath(); ctx.arc(hx+f*2,hy+0.4,2.4,0,Math.PI*2); ctx.fill();   // shadowed face
    if(!flash){ ctx.fillStyle='rgba(180,60,50,0.9)'; ctx.beginPath(); ctx.arc(hx+f*2.6,hy+0.2,0.7,0,Math.PI*2); ctx.fill(); } // eye glint
    // long scoped rifle at chest line, gripped by two arms
    const gy=y+11;
    ctx.fillStyle=C('#1c1c22'); ctx.fillRect(f>0?x+4:x-12, gy-1.4, 20, 2.8);
    ctx.fillStyle=C('#3a3a44'); ctx.fillRect(f>0?x+9:x-7, gy-3.4, 6, 2);          // scope
    limb(hx-f*1, hy+5, f>0?x+13:x-5, gy, 3, C('#4e564c'));                        // forward arm
    limb(x+e.w/2-f*1, hy+6, f>0?x+7:x+1, gy-1, 3, C('#4e564c'));                  // trigger arm
    if(!flash){ ctx.fillStyle='rgba(140,200,255,0.9)'; ctx.beginPath(); ctx.arc(f>0?x+14.5:x-6.5, gy-2.4, 0.9, 0, Math.PI*2); ctx.fill(); }
    if(e.tel>0){
      ctx.strokeStyle='rgba(255,70,60,'+(0.35+0.3*Math.sin(time*20))+')'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x+e.w/2+f*8, gy); ctx.lineTo(x+e.w/2+f*268, gy+ (p?(pCY(p)-gy)*0.3:0)); ctx.stroke(); ctx.lineWidth=1;
    }
  }
}
function drawPlayer(p){
  if(!p.alive) return;
  if(p.inv>0 && Math.floor(time*14)%2===0) return; // blink
  const x=p.x-cam.x, y=p.y;
  const wRate=WPN[p.weapon].rate/(1+0.3*p.rapid);
  const muzzle=p.cool>0 && (wRate-p.cool)<0.07;
  if(p.prone){
    const f=p.facing, C=c=>c;
    drawShadow(x+8, y+16, 15);
    // extended legs, low torso, helmet forward, rifle flat
    limb(x+(f>0?-4:14), y+12, x+(f>0?-14:24), y+14, 4.6, '#3c4a30');
    limb(x+(f>0?-2:12), y+13, x+(f>0?-12:22), y+15.5, 4.6, '#3c4a30');
    ctx.fillStyle=p.i===0?'#4a5d3a':'#4c4148';
    ctx.beginPath(); ctx.ellipse(x+(f>0?9:9), y+10, 10, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.stroke();
    ctx.fillStyle=p.i===0?'#d9a06b':'#c98f5f';
    ctx.beginPath(); ctx.arc(x+(f>0?18:0), y+8, 4.4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle=p.i===0?'#2a4fa0':'#a03028';
    ctx.beginPath(); ctx.arc(x+(f>0?18:0), y+7.2, 4.8, Math.PI, 0); ctx.lineTo(x+(f>0?23:-5), y+8.4); ctx.lineTo(x+(f>0?13:-1), y+8.4); ctx.fill();
    ctx.fillStyle='#26262e'; ctx.fillRect(f>0?x+16:x-16, y+9, 14, 2.6);
    if(muzzle){ ctx.fillStyle='rgba(255,220,120,0.95)';
      ctx.beginPath(); ctx.arc(f>0?x+31:x-17, y+10, 3, 0, Math.PI*2); ctx.fill(); }
  }else{
    drawSoldier(x,y,p.w,p.h,{facing:p.facing, aim:Math.atan2(p.aimy,p.aimx),
      suit:p.i===0?'#4a5d3a':'#4c4148', suit2:p.i===0?'#3b4c2d':'#3c333a',
      skin:p.i===0?'#d9a06b':'#c98f5f', helm:p.i===0?'#3f4f33':'#43393f',
      band:p.i===0?'#2a4fa0':'#a03028',
      phase:p.anim, grounded:p.onGround, flash:false, gun:18, muzzle});
  }
}

function drawParticles(){
  for(const q of particles){
    const a=Math.max(0,q.life/q.maxLife);
    if(q.type==='boom'){

      ctx.beginPath(); ctx.arc(q.x-cam.x,q.y,Math.max(1,q.r),0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
    }else if(q.type==='text'){
      ctx.fillStyle='rgba(255,255,160,'+a+')'; ctx.font='bold 13px monospace'; ctx.textAlign='center';
      ctx.fillText(q.txt, q.x-cam.x, q.y-(1-a)*20);
    }else{
      ctx.fillStyle='rgba(255,220,120,'+a+')';
      ctx.fillRect(q.x-cam.x-1,q.y-1,3,3);

function bigText(txt,y,c,size){

function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,cvs.width,cvs.height);
  const shx=shake>0?(Math.random()-0.5)*shake:0, shy=shake>0?(Math.random()-0.5)*shake:0;
  ctx.setTransform(S,0,0,S,ox+shx*S,oy+shy*S);
  drawBg(); drawTiles(); drawBoss(); drawPodsCapsules();
  for(const e of enemies) drawEnemy(e);
  for(const p of players) drawPlayer(p);
  drawBullets(); drawParticles();
  if(state==='playing'||state==='stageclear') drawHUD();
  if(state==='stageclear'){
    if(Math.floor(scT*8)%2===0) dimAll(0.18);
    bigText('STAGE CLEAR',LH/2,'#ffe37a',54);
  }
  if(state==='title'){
    dimAll(0.55);
    bigText('C O N T R A',170,'#ff4040',64);
    bigText('RUN & GUN',215,'#ffe37a',24);
    ctx.fillStyle='#cfd8ea'; ctx.font='15px monospace'; ctx.textAlign='center';
    ctx.fillText('P1:  A/D move   W or SPACE jump   S prone/drop   MOUSE aims — fire with J or LEFT CLICK',LW/2,300);
    ctx.fillText('P2:  ARROWS move/jump   , or . fire',LW/2,325);
    ctx.fillText('P pause',LW/2,350);
    ctx.fillStyle=Math.floor(time*2)%2?'#ffffff':'#8899bb';

    ctx.fillStyle='#9fb4d8'; ctx.fillText('BEST '+String(best).padStart(6,'0'),LW/2,460);
    ctx.textAlign='left';
  }else if(state==='gameover'){
    dimAll(0.6); bigText('GAME OVER',LH/2-20,'#ff5050',56);
    bigText('SCORE '+score,LH/2+30,'#ffe37a',26);
    if(goT>0.8){ ctx.fillStyle=Math.floor(time*2)%2?'#fff':'#889'; ctx.font='16px monospace'; ctx.textAlign='center'; ctx.fillText('ENTER — TITLE',LW/2,LH/2+90); ctx.textAlign='left'; }
  }else if(state==='victory'){
    dimAll(0.6); bigText('MISSION COMPLETE',LH/2-20,'#7dffb0',48);
    bigText('SCORE '+score,LH/2+30,'#ffe37a',26);
    if(goT>0.8){ ctx.fillStyle=Math.floor(time*2)%2?'#fff':'#889'; ctx.font='16px monospace'; ctx.textAlign='center'; ctx.fillText('ENTER — TITLE',LW/2,LH/2+90); ctx.textAlign='left'; }
  }
}

/* ============================== LOOP ============================== */
let acc=0, last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  if(__paused){ last=now; return; }
  acc+=Math.min(250, now-last); last=now;
  while(acc>=STEP*1000){ update(); acc-=STEP*1000; }
  draw();
}
loadStage(0);
requestAnimationFrame(frame);

/* ============================== TEST HOOKS ============================== */
window.game={
  tick(n){ for(let i=0;i<n;i++) update(); },
  step(n){ for(let i=0;i<n;i++){ update(); draw(); } },
  pause(){ __paused=true; },
  resume(){ __paused=false; last=performance.now(); },
  get state(){ return state; },
  get score(){ return score; },
  get lives(){ return players.map(p=>p.lives); },
  get weapon(){ return players[0]?players[0].weapon:null; },
  get rapid(){ return players[0]?players[0].rapid:0; },
  get stage(){ return Math.min(stageIdx+1, STAGES.length); },
  get playerPos(){ return players[0]?{x:players[0].x,y:players[0].y,w:players[0].w,h:players[0].h}:null; },
  get pdebug(){ const p=players[0]; return p?{prone:p.prone, onGround:p.onGround, stand:p.standType,
      alive:p.alive, deadT:Math.round(p.deadT*100)/100, safe:[Math.round(p.safeX),Math.round(p.safeY)],
      keys:Array.from(typeof keys!=='undefined'?keys:[])}:null; },
  get bullets(){ return pBullets; },
  get ebullets(){ return eBullets; },
  get enemies(){ return enemies; },
  get pickups(){ return capsules.map(c=>c.kind).concat(pods.map(p=>p.kind)); },
  get bossHp(){ return boss?(boss.dead?0:boss.hp):-1; },
  get best(){ return best; },
  get time(){ return time; },
  addScore(n){ score+=n; },
  start2(){ startGame(true); },
  start(s){ startGame(false); const n=(s|0)-1; for(let k=0;k<n && stageIdx<STAGES.length-1;k++) advanceStageTo(k+1); },
  gotoStage(n){ advanceStageTo((n|0)-1); },
  setPlayerPos(x,y,i){
    const p=players[i||0]; if(!p) return false;
    if(!(x>=0&&y>=0&&x<=MAPW-p.w&&y>=0&&y<=ROWS*TS-p.h)) return false;
    const cx=Math.floor((x+p.w/2)/TS), cyFeet=Math.floor((y+p.h-2)/TS), cyHead=Math.floor((y+2)/TS);
    if(tileAt(cx,cyHead)==='#'||tileAt(cx,cyFeet)==='#') return false;
    p.x=x; p.y=y; p.vx=0; p.vy=0;
    if((i||0)===0) cam.x=Math.max(0, Math.min(x-LW*0.45, MAPW-LW));   // snap camera so clamp doesn't drag player back
    return true;
  },
  get pos2(){ const p=players[1]; return p?{x:p.x,y:p.y,alive:p.alive}:null; },
  get camX(){ return cam.x; },
  setWeapon(k){ const p=players[0]; if(!p) return false;
    if(k==='r'){ p.rapid=Math.min(3,p.rapid+1); return true; }
    if(!WPN[k]) return false;
    p.weapon=k; p.cool=0; return true; },
  spawnEnemy(type,x,y){ if(!ETYPE[type]||enemies.length>=MAX_ENEMIES) return null;
    const e=makeEnemy(type,x,y,false); enemies.push(e); return e.id; },
  spawnPickup(kind){ const p=players[0]; if(!p) return false;
    if(kind!=='r'&&!WPN[kind]) return false;
    capsules.push({kind, x:pCX(p)+50, y:(p.onGround?pCY(p):p.y+p.h+6), bob:0}); return true; },
  setFire(on,i){ const p=players[i||0]; if(p) p.fireOv=!!on; },
  aimAt(deg,i){ const p=players[i||0]; if(!p) return; p.aimMode='keys'; p.aimHold=true;
    const a=deg*Math.PI/180; p.aimx=Math.cos(a); p.aimy=Math.sin(a);
    if(Math.abs(p.aimx)>0.2) p.facing=p.aimx>0?1:-1; },
  damageBoss(n){ if(boss&&!boss.dead){ boss.hp-=n; boss.flash=0.08; if(boss.hp<=0) killBoss(); } },
  killPlayer(){ if(players[0]) killPlayer(players[0]); },
  killAll(){ killAllFx(); }
};
function advanceStageTo(targetIdx){
  // jump directly (for tests): load stage targetIdx keeping players
  const carry=players.map(p=>p.weapon), carryR=players.map(p=>p.rapid);
  loadStage(targetIdx);
  players.forEach((p,k)=>{ p.weapon=carry[k]||'rifle'; p.rapid=carryR[k]||0; });
  state='playing';
}
</script>
